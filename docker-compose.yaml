services:
  db:
    image: postgres:16.14
    container_name: sfrigola_db
    environment:
      POSTGRES_DB: sfrigola_db
      POSTGRES_USER: berau
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: