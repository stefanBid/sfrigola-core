spring:
  application:
    name: sfrigola-core
  profiles:
    default: dev

  # ===== PostgreSQL =====
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never

  # ===== Multipart uploads =====
  # Must be >= the largest maxSizeMb declared across @ValidImage usages (UpsetRecipeCoverDto: 10),
  # otherwise Spring rejects the request before it ever reaches controller/validator and the
  # per-field IMAGE_SIZE_TOO_LARGE message never fires.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true

server:
  servlet:
    context-path: /sfrigola-core
  port: ${SERVER_PORT}

# ===== Aspects =====
sc:
  aspect:
    execution-time:
      fast-threshold-ms: 100
      slow-threshold-ms: 500
