spring:
  # ===== Docker Compose (auto-starts local Postgres container) =====
  docker:
    compose:
      file: docker-compose.dev.yaml

  jpa:
    show-sql: true

# ===== JWT =====
JWT_SECRET_KEY: ${JWT_SECRET_KEY:dev-only-jwt-secret-key-not-for-production-use-1234567890}
JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
ALLOWED_ORIGINS: http://localhost:3000
