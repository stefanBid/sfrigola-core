spring:
  # ===== Docker Compose (auto-starts local Postgres container) =====
  docker:
    compose:
      file: docker-compose.dev.yaml

  jpa:
    show-sql: true

# ===== JWT =====
# Plain literal values on purpose, NOT ${JWT_SECRET_KEY:...} — a same-name placeholder
# default is circular in Spring when no higher-precedence source (OS env var) provides
# the value first. A plain value here is still overridden by a real env var of the
# same name (OS env > profile YAML in Spring's property source precedence).
JWT_SECRET_KEY: 7680c768591932767e15e38642bd3208af87a37e944a422ab5b3e28be1bc7c69
JWT_EXPIRATION_MS: 86400000

# ===== CORS =====
ALLOWED_ORIGINS: http://localhost:3000

# ===== FILE STORAGE =====
# Plain literal, NOT ${FILE_STORAGE_ROOT_DIR:...} — same-name placeholder default is
# circular in Spring with no higher-precedence source; a real env var still overrides this.
FILE_STORAGE_ROOT_DIR: ./uploads
