spring.application.name=sfrigola-core

server.servlet.context-path=/sfrigola-core
server.port=8080

# Tests connect to an already-running Postgres (local docker-compose, or CI service container) -
# no Docker Compose lifecycle management needed here.
spring.docker.compose.enabled=false

# ===== PostgreSQL =====
# Same credentials as docker-compose.dev.yaml (local/CI throwaway DB, not a real secret).
spring.datasource.url=jdbc:postgresql://localhost:5432/sfrigola_db
spring.datasource.username=berau
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never

# ===== JPA / Hibernate =====
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== Aspects =====
sc.aspect.execution-time.fast-threshold-ms=100
sc.aspect.execution-time.slow-threshold-ms=500
