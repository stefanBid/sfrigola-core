name: Build Check

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the job while the PR is still a draft, to save CI minutes.
    # The job will run once the PR is marked "Ready for review"
    # (or on any push if it's already non-draft).
    if: github.event.pull_request.draft == false

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # Install JDK 25 (matches java.version in pom.xml)
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Compile the project (no tests present)
      - name: Build with Maven (compile only)
        run: mvn -B clean compile