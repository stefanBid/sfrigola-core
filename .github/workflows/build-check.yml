name: Build Check

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ "main", "master", "develop" ]

# If a new commit arrives while a previous run (on the same branch/PR)
# is still in progress, cancel the older run: only the latest code matters.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the job while the PR is still a draft, to save CI minutes.
    # This condition only applies to pull_request events; for push events
    # github.event.pull_request is null, so the check evaluates to true.
    if: github.event.pull_request.draft != true

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # Install JDK 25 (matches java.version in pom.xml)
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Compile the project (no tests present)
      - name: Build with Maven (compile only)
        run: mvn -B clean compile