name: Build Check

on:
  pull_request:
    branches: [ "main", "master", "develop" ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ "main", "master", "develop" ]

# If a new commit arrives while a previous run (on the same branch/PR)
# is still in progress, cancel the older run: only the latest code matters.
concurrency:
  group: build-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip the job while the PR is still a draft, to save CI minutes.
    # This condition only applies to pull_request events; for push events
    # github.event.pull_request is null, so the check evaluates to true.
    if: github.event.pull_request.draft != true

    # Same image/credentials as docker-compose.dev.yaml - contextLoads (@SpringBootTest) needs a real
    # Postgres, ddl-auto=none means the schema must be loaded explicitly (see step below).
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_DB: sfrigola_db
          POSTGRES_USER: berau
          POSTGRES_PASSWORD: admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U berau -d sfrigola_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v5

      # Install JDK 25 (matches java.version in pom.xml)
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Service containers start before checkout, so the init-script volume trick from
      # docker-compose.dev.yaml doesn't apply here - load the schema explicitly instead.
      - name: Load DB schema
        env:
          PGPASSWORD: admin
        run: psql -h localhost -U berau -d sfrigola_db -f src/main/resources/sql/createSfrigolaDB.sql

      - name: Build with Maven
        run: mvn -B clean test